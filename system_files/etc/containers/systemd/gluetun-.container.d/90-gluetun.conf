[Container]
AddCapability=NET_ADMIN
AddCapability=NET_BIND_SERVICE
AddDevice=/dev/net/tun
Environment=VPN_SERVICE_PROVIDER=airvpn
Environment=VPN_TYPE=wireguard
Environment=WIREGUARD_ADDRESSES='10.170.212.198/32,fd7d:76ee:e68f:a993:9ed8:94d4:1b6d:cb71/128'
Environment=HEALTH_SMALL_CHECK_TYPE=dns
Environment=HEALTH_RESTART_VPN=off
HealthCmd=nslookup example.org 127.0.0.1
HealthOnFailure=kill
HealthRetries=2
Image=ghcr.io/qdm12/gluetun:v3.41
Mount=type=tmpfs,destination=/tmp,chown=true
Network=private
Notify=healthy
Secret=gluetun-key,type=env,target=WIREGUARD_PRIVATE_KEY
Secret=gluetun-psk,type=env,target=WIREGUARD_PRESHARED_KEY
StopSignal=SIGKILL
Volume=/etc

[Service]
Restart=on-failure
RestartMode=direct
